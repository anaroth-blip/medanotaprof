<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TropeBooks - Cadastrar Livro</title>
  <!-- Bootstrap CSS para estilização dos cards e formulário -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h1 class="h3 mb-4 text-center">Cadastro de Livros</h1>

          <form id="contactForm">
            <div class="mb-3">
              <label for="titulo" class="form-label">Título do Livro:</label>
              <input
                type="text"
                id="titulo"
                name="titulo"
                class="form-control"
                placeholder="Ex: Jogos Vorazes"
                required
              />
            </div>

            <div class="mb-3">
              <label for="autor" class="form-label">Autor(a):</label>
              <input
                type="text"
                id="autor"
                name="autor"
                class="form-control"
                placeholder="Ex: Suzanne Collins"
                required
              />
            </div>

            <div class="mb-3">
              <label for="trope" class="form-label">Trope Principal:</label>
              <input
                type="text"
                id="trope"
                name="trope"
                class="form-control"
                placeholder="Ex: Enemies to Lovers, Slow Burn..."
                required
              />
            </div>

            <div class="mb-4">
              <label for="resenha" class="form-label">Sinopse ou Resenha:</label>
              <textarea
                id="resenha"
                name="resenha"
                class="form-control"
                placeholder="Digite um resumo ou comentário sobre o livro"
                rows="3"
                required
              ></textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary mb-4">
                Salvar no TropeBooks
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

 <script type="module" src="enviarDados.js"></script>
